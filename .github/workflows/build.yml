name: Build Flutter APK

on:
  push:
    branches: [ main, master, основной ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Extract project ZIP safely
        run: |
          # Распаковываем архив с принудительной конвертацией кодировок для кириллицы
          unzip -O CP866 edki.zip -d extracted_project || unzip edki.zip -d extracted_project

      - name: Build APK
        run: |
          # Ищем, где лежит pubspec.yaml, и переходим туда
          PROJECT_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
